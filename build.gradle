plugins {
    id 'com.diffplug.spotless' version '6.25.0' apply false
    id 'com.github.spotbugs' version '6.0.26' apply false
}

subprojects {
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'com.github.spotbugs'

    // 소스에 한글 주석/문자열 리터럴이 포함되어 있으므로, OS 기본 인코딩이 UTF-8이 아닌 환경
    // (예: 한국어 Windows의 CP949/x-windows-949)에서 javac가 플랫폼 기본 인코딩으로 소스를 읽어
    // 한글이 깨진 문자열로 컴파일되는 것을 방지하기 위해 인코딩을 명시적으로 UTF-8로 고정한다.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    spotless {
        java {
            eclipse()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    spotbugs {
        toolVersion = '4.9.2'
        // 확인된 오탐/의도된 설계만 config/spotbugs/exclude.xml로 좁혀서 제외하고,
        // 나머지는 실제 빌드 게이트로 동작하도록 실패를 허용하지 않는다.
        ignoreFailures = false
        showStackTraces = false
        showProgress = false
        effort = 'default'
        reportLevel = 'medium'
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html {
                required = true
            }
            xml {
                required = true
            }
        }
    }
}
