plugins {
    id 'java-library'
    id 'jacoco'
}

group = 'io.github.sweetpark'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.jsqlparser:jsqlparser:4.8'
    implementation 'org.mybatis:mybatis:3.5.15'
    implementation 'org.springframework:spring-jdbc:6.1.2'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    
    // DB 메타데이터 및 EXPLAIN 실행을 위한 드라이버 (사용자가 런타임에 제공하거나 빌드에 포함 가능)
    compileOnly 'com.mysql:mysql-connector-j:8.3.0'
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.3'

    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    // 실제 DB 컨테이너에 접속하기 위한 드라이버 (compileOnly 는 런타임에 없음 — 통합 테스트용으로 testImplementation 추가)
    testImplementation 'com.mysql:mysql-connector-j:8.3.0'
    testImplementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    testImplementation 'org.postgresql:postgresql:42.7.2'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    finalizedBy jacocoTestReport
    jacoco {
        includes = ['io.github.sweetpark.*']
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs Docker/Testcontainers-based integration tests (tag: integration)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
    jacoco {
        // 통합 테스트는 실제 컨테이너/드라이버를 다루므로 커버리지 계측 대상이 아니며,
        // JaCoCo 0.8.12는 최신 JDK의 클래스 파일 버전을 계측하지 못해 실패할 수 있다.
        enabled = false
    }
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.00
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

