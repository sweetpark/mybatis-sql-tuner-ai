plugins {
    id 'java'
    id 'jacoco'
    id 'org.jetbrains.intellij.platform' version '2.6.0'
}

group = 'io.github.sweetpark'
version = '0.1.2' // x-release-please-version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation project(':mybatis-sql-tuner-core')

    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'com.h2database:h2:2.2.224'

    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    intellijPlatform {
        intellijIdeaCommunity '2024.1'
    }
}

intellijPlatform {
    pluginConfiguration {
        id = 'io.github.sweetpark.mybatis-sql-tuner-ai'
        name = 'MyBatis SQL Tuner AI'
        version = project.version
        description = '''
        MyBatis SQL Tuner AI is an AI-assisted SQL tuning and static analysis tool for IntelliJ IDEA.
        It automatically converts dynamic MyBatis XML queries into executable SQL, executes EXPLAIN
        and schema inspection on your database, and streams real-time AI tuning recommendations.
        '''
        changeNotes = '''
        <h3>0.1.2</h3>
        <ul>
            <li>Fix: table/index metadata lookup was hardcoded to uppercase table names, which only matched H2's identifier storage. PostgreSQL (lowercase) and MySQL/MariaDB (as-created case) now resolve correctly instead of returning empty DDL/index info</li>
        </ul>
        <h3>0.1.1</h3>
        <ul>
            <li>Fix: PostgreSQL and H2 JDBC drivers were not bundled in the distributed plugin, causing a ClassNotFoundException at runtime</li>
            <li>Fix: force UTF-8 build encoding so Korean text no longer gets corrupted on non-UTF-8-locale platforms</li>
            <li>Security: DB password and AI API key now stored via PasswordSafe (OS credential store) instead of plaintext</li>
            <li>Mask the AI API key field in the settings dialog</li>
        </ul>
        <h3>0.1.0</h3>
        <ul>
            <li>Initial public release</li>
            <li>Real-time AI streaming analysis (OpenAI / Ollama compatible)</li>
            <li>Automatic MyBatis dynamic tag stripping and fakeSql EXPLAIN execution</li>
            <li>Project-level persistent DB and AI settings</li>
        </ul>
        '''
        ideaVersion {
            sinceBuild = '241'
            untilBuild = '251.*'
        }
        vendor {
            name = 'sweetpark'
            url = 'https://github.com/sweetpark/mybatis-sql-tuner-ai'
        }
    }
    publishing {
        token = providers.environmentVariable("JETBRAINS_MARKETPLACE_TOKEN")
    }
    signing {
        certificateChain = providers.environmentVariable("CERTIFICATE_CHAIN")
        privateKey = providers.environmentVariable("PRIVATE_KEY")
        password = providers.environmentVariable("PRIVATE_KEY_PASSWORD")
    }
    instrumentCode = false
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}
