name: Release Plugin to JetBrains Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.2) — use this to re-run a release that never triggered automatically'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish to Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify All Tests & 100% Coverage
        run: ./gradlew check

      - name: Verify Marketplace Secrets Are Configured
        run: |
          if [ -z "${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}" ]; then
            echo "::error::JETBRAINS_MARKETPLACE_TOKEN secret is not set. Register it in JetBrains Marketplace > My tokens before pushing a release tag."
            exit 1
          fi

      - name: Publish Plugin to Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew :mybatis-sql-tuner-intellij:publishPlugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mybatis-sql-tuner-intellij/build/distributions/*.zip
          generate_release_notes: true
